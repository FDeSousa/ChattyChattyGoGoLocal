name: ChattyChattyGoGoLocal
packages:
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.1.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
options:
  bundleIdPrefix: pt.com.desousa.filipe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N9Q487K8WW
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  ChattyChattyGoGoLocal:
    type: application
    platform: iOS
    dependencies:
      - package: HighlightSwift
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    sources:
      - path: ChattyChattyGoGoLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGoLocal
        PRODUCT_NAME: ChattyChattyGoGoLocal
        INFOPLIST_KEY_CFBundleDisplayName: "ChattyChatty GoGo Local"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID keeps your private conversations locked when you leave the app."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "ChattyChatty GoGo can find or create calendar events when you ask it to. The app asks before sharing event details or creating an event."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "ChattyChatty GoGo can create reminders when you ask it to, after showing you the proposed reminder for confirmation."
        INFOPLIST_KEY_NSContactsUsageDescription: "ChattyChatty GoGo can look up a contact when you ask it to. The app asks before sharing matching details with a model."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ChattyChattyGoGoLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChattyChattyGoGoLocalTests
    dependencies:
      - target: ChattyChattyGoGoLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGoLocalTests
        GENERATE_INFOPLIST_FILE: YES

  ChattyChattyGoGoLocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChattyChattyGoGoLocalUITests
    dependencies:
      - target: ChattyChattyGoGoLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGoLocalUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChattyChattyGoGoLocal

schemes:
  ChattyChattyGoGoLocal:
    build:
      targets:
        ChattyChattyGoGoLocal: all
        ChattyChattyGoGoLocalTests: [test]
        ChattyChattyGoGoLocalUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChattyChattyGoGoLocalTests
        - ChattyChattyGoGoLocalUITests
